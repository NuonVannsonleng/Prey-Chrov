<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ព្រៃជ្រៅ — Prey Chrov</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #070d0c;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #fatal {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        max-width: min(680px, calc(100% - 32px));
        padding: 12px 16px;
        background: #1b0f0c;
        color: #f2e6d8;
        border: 1px solid #d9644a;
        border-radius: 8px;
        font: 15px/1.4 'Kantumruy Pro', system-ui, sans-serif;
        z-index: 10;
      }
      #fatal button {
        margin: 8px 8px 0 0;
        padding: 6px 12px;
        font: inherit;
        color: inherit;
        background: #2a1a14;
        border: 1px solid #e6b866;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>Prey Chrov needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
